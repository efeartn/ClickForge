name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ClickForge-Windows
            asset_name: ClickForge-Windows.zip
          - os: macos-latest
            artifact_name: ClickForge-macOS
            asset_name: ClickForge-macOS.zip
          - os: ubuntu-latest
            artifact_name: ClickForge-Linux
            asset_name: ClickForge-Linux.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux X11 / OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev zip

      - name: Run unit tests
        run: cargo test

      - name: Build native release binary
        run: cargo build --release

      - name: Stage platform bundle
        shell: bash
        run: |
          rm -rf dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p dist/ClickForge
            cp target/release/ClickForge.exe dist/ClickForge/ClickForge.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            VER=$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)
            mkdir -p dist/ClickForge.app/Contents/MacOS dist/ClickForge.app/Contents/Resources
            cp target/release/ClickForge dist/ClickForge.app/Contents/MacOS/ClickForge
            chmod +x dist/ClickForge.app/Contents/MacOS/ClickForge
            cp assets/icon.icns dist/ClickForge.app/Contents/Resources/icon.icns
            cat > dist/ClickForge.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>ClickForge</string>
            <key>CFBundleExecutable</key><string>ClickForge</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>com.efeartn.ClickForge</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>ClickForge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          else
            mkdir -p dist/ClickForge
            cp target/release/ClickForge dist/ClickForge/ClickForge
            chmod +x dist/ClickForge/ClickForge
          fi

      - name: Smoke-test built binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command '$p = Start-Process -FilePath "dist\ClickForge\ClickForge.exe" -ArgumentList "--smoke-test" -Wait -PassThru; exit $p.ExitCode'
          elif [ "$RUNNER_OS" = "macOS" ]; then
            dist/ClickForge.app/Contents/MacOS/ClickForge --smoke-test
          else
            dist/ClickForge/ClickForge --smoke-test
          fi

      - name: Prepare Windows Artifact & Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$ver" "installer\ClickForge.iss"
          Copy-Item "dist\ClickForge-Setup.exe" "ClickForge-Setup.exe" -Force

          # Include tiny migration marker in zip so v3.3.x in-app updater upgrades cleanly to v4.0.0
          New-Item -ItemType Directory -Force -Path "dist\ClickForge\_internal" | Out-Null
          New-Item -ItemType File -Force -Path "dist\ClickForge\_internal\.migrated" | Out-Null
          Compress-Archive -Path dist/ClickForge/* -DestinationPath ${{ matrix.asset_name }} -Force

      - name: Prepare macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ClickForge.app ../${{ matrix.asset_name }}

      - name: Prepare Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd dist/ClickForge
          chmod +x ClickForge
          zip -ry ../../${{ matrix.asset_name }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload Windows Installer Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClickForge-Setup
          path: ClickForge-Setup.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ClickForge-Windows/ClickForge-Windows.zip
            artifacts/ClickForge-Setup/ClickForge-Setup.exe
            artifacts/ClickForge-macOS/ClickForge-macOS.zip
            artifacts/ClickForge-Linux/ClickForge-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
