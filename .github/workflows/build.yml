name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ClickForge-Windows
            asset_name: ClickForge-Windows.zip
          - os: macos-latest
            artifact_name: ClickForge-macOS
            asset_name: ClickForge-macOS.zip
          - os: ubuntu-latest
            artifact_name: ClickForge-Linux
            asset_name: ClickForge-Linux.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller certifi

      - name: Build Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-dev xvfb

      - name: Run unit tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover tests
          else
            python -m unittest discover tests
          fi
        shell: bash

      - name: Build executable with PyInstaller
        run: pyinstaller clickforge.spec --clean -y

      - name: Prepare Windows Artifact & Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ClickForge/* -DestinationPath ${{ matrix.asset_name }}
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $ver = python -c "import clickforge; print(clickforge.__version__)"
          & $iscc "/DAppVersion=$ver" "installer\ClickForge.iss"
          Copy-Item "dist\ClickForge-Setup.exe" "ClickForge-Setup.exe" -Force

      - name: Prepare macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} ClickForge.app

      - name: Prepare Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cd dist/ClickForge
          zip -r ../../${{ matrix.asset_name }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload Windows Installer Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClickForge-Setup
          path: ClickForge-Setup.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ClickForge-Windows/ClickForge-Windows.zip
            artifacts/ClickForge-Setup/ClickForge-Setup.exe
            artifacts/ClickForge-macOS/ClickForge-macOS.zip
            artifacts/ClickForge-Linux/ClickForge-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
