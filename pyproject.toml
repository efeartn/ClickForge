[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clickforge"
dynamic = ["version"]
description = "A cross-platform auto-clicker built with Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ClickForge Contributors"},
]
dependencies = [
    "customtkinter>=5.2.0",
    "pynput>=1.7.6",
    "platformdirs>=4.0.0",
    "Pillow>=10.0.0"
]

[project.optional-dependencies]
macos = ["pyobjc-framework-ApplicationServices>=10.0"]

[project.scripts]
clickforge = "clickforge.app:main"

[project.urls]
Homepage = "https://github.com/efeartn/ClickForge"
Repository = "https://github.com/efeartn/ClickForge.git"
Issues = "https://github.com/efeartn/ClickForge/issues"

[tool.setuptools.dynamic]
version = {attr = "clickforge.__version__"}
